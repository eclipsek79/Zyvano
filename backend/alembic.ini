# Alembic Configuration File
# This file is used by Alembic to manage database migrations.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Path prepended to sys.path so `import zyvano` resolves
# without requiring an editable install. The package was originally named
# `zyvano`; every Python import now uses the `zyvano` namespace.
prepend_sys_path = %(here)s/src

# Leave this EMPTY on purpose.
#
# It previously held the placeholder `driver://user:pass@localhost/dbname`.
# alembic/env.py injects the real URL from settings.BACKEND_DATABASE_URL, but
# `alembic revision --autogenerate` reaches engine_from_config() before that
# injection matters, so the placeholder was an actual attempt to connect to a
# host named `driver`. There is no default: the URL comes from the environment
# only. Set BACKEND_DATABASE_URL, never hardcode a connection string here.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
